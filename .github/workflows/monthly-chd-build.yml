name: Monthly standalone CHD build

# For a repository that holds xemu's code: a fork of xemu-project/xemu, or one
# that is not a fork (an account that has a fork of a fork of xemu already can
# not fork it again: GitHub allows one fork per fork network). On the 1st of
# every month (04:23 UTC), and whenever it is run by hand:
#
#   1. master is made identical to xemu-project/xemu's master (and made, in a
#      repository that has none yet: the first run pushes all of xemu's history);
#   2. chd-support is made again: that master, with the patches of the patches
#      folder applied to it (the CHD support: a block driver for chdman's
#      images, read on worker threads, and the loader and file dialog taking
#      .chd). It is made again, not merged forward: a patch put on a fresh
#      master can not collect the debris of earlier months, and one that has
#      stopped applying says so at once;
#   3. chd-support is built for Windows x86_64, release, as upstream builds it
#      (build-windows.yml), and the build is the run's artifact.
#
# This file and the patches folder live on a branch of their own, which has to
# be the repository's default branch (scheduled workflows run from there only):
# step 1 would delete them from master, and step 2 from chd-support. Make it so,
# in a new empty repository on GitHub (no README, no licence), whose default
# branch will be the first one pushed:
#
#   git init -b automation && mkdir -p .github/workflows patches
#   cp <this file> .github/workflows/monthly-chd-build.yml
#   cp <the patch> patches/
#   git add .github patches && git commit -m "Monthly CHD build [skip ci]"
#   git remote add origin https://github.com/<you>/<repository>.git
#   git push -u origin automation
#
# (In a fork, make the same branch from a clone and make it the default branch
# in Settings > General.)
#
# Also needed once: a personal access token in the secret SYNC_TOKEN (Settings >
# Secrets and variables > Actions), as the job's own token may not push a commit
# that changes .github/workflows, which a master of upstream does sooner or
# later. A fine-grained token for this repository, with Contents and Workflows
# set to Read and write, is enough.
#
# A patch that does not apply to master stops the job, with the files in the
# run's summary, and GitHub mails the failed run. The commits of chd-support end
# in [skip ci], so that upstream's own CI (every platform and its tests, which
# it runs on every push to a branch) does not start on them.

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Build chd-support after making it'
        type: boolean
        default: true

concurrency:
  group: monthly-chd-build
  cancel-in-progress: false

permissions:
  contents: read   # the pushes use SYNC_TOKEN

env:
  UPSTREAM_REPO: xemu-project/xemu
  UPSTREAM_BRANCH: master
  MIRROR_BRANCH: master
  FEATURE_BRANCH: chd-support
  PATCH_DIR: patches
  # Where upstream's Windows build gets its image from, and the image to use if
  # that line is not found there any more
  IMAGE_FILE: .github/workflows/build-windows.yml
  FALLBACK_IMAGE: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-2881edd

jobs:
  sync:
    name: Sync master and make chd-support
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check that SYNC_TOKEN is set
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error title=SYNC_TOKEN is not set::Add a personal access token (Contents and Workflows: read and write, for this repository) as the repository secret SYNC_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Make the mirror branch identical to upstream
        run: |
          up=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          # a repository that is not a fork has no mirror branch until this step makes it
          mine=$(git rev-parse --verify --quiet "origin/${MIRROR_BRANCH}" || true)
          {
            echo "### ${MIRROR_BRANCH}"
            echo "${UPSTREAM_REPO} ${UPSTREAM_BRANCH} is at \`${up:0:10}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$up" = "$mine" ]; then
            echo "${MIRROR_BRANCH} is already identical." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Commits of the fork's own on the mirror go with the reset: say which
          if [ -n "$mine" ] && [ "$(git rev-list --count "$up..$mine")" != 0 ]; then
            echo "::warning title=${MIRROR_BRANCH} had commits that upstream does not have::They are replaced; the run's summary lists them."
            {
              echo
              echo "Replaced (not in upstream), as \`git branch rescue <sha>\` can still bring them back for a while:"
              git log --format='- %h %s' "$up..$mine"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git push --force origin "$up:refs/heads/${MIRROR_BRANCH}"
          if [ -n "$mine" ]; then
            echo "${MIRROR_BRANCH} was at \`${mine:0:10}\`, now at \`${up:0:10}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "${MIRROR_BRANCH} did not exist: made at \`${up:0:10}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Make the feature branch again, from master and the patches
        run: |
          shopt -s nullglob
          found=("${PATCH_DIR}"/*.patch)
          if [ "${#found[@]}" = 0 ]; then
            echo "::error title=No patches::There is no *.patch file in ${PATCH_DIR}/ of the default branch."
            exit 1
          fi
          # the checkout below replaces the working tree, and the patches with it
          rm -rf "${RUNNER_TEMP}/patches" && mkdir -p "${RUNNER_TEMP}/patches"
          cp "${found[@]}" "${RUNNER_TEMP}/patches/"

          up=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          git checkout -q -B "${FEATURE_BRANCH}" "$up"
          echo "### ${FEATURE_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          # --3way: upstream may have moved a little around what a patch changes;
          # --empty=drop: a patch that upstream has taken in since is nothing to apply
          if git am --3way --empty=drop "${RUNNER_TEMP}"/patches/*.patch; then
            echo "Master \`${up:0:10}\` with ${#found[@]} patch file(s): $(git rev-list --count "$up..HEAD") commit(s) on top." >> "$GITHUB_STEP_SUMMARY"
          else
            files=$(git diff --name-only --diff-filter=U)
            git am --abort
            {
              echo "**The patches do not apply to master \`${up:0:10}\`**: conflicts in"
              echo '```'
              echo "$files"
              echo '```'
              echo "${FEATURE_BRANCH} was left as it was."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=The patches do not apply to master::Conflicts in: $(echo "$files" | tr '\n' ' ')"
            exit 1
          fi
          # the last commit is the one that upstream's CI looks at: skip it
          git commit -q --allow-empty -m "${FEATURE_BRANCH}: master ${up:0:10} with the patches of ${PATCH_DIR}/ [skip ci]"

      - name: Push the feature branch
        run: git push --force origin "HEAD:refs/heads/${FEATURE_BRANCH}"

      - name: Find the toolchain image of upstream's Windows build
        id: image
        run: |
          image=$(git show "upstream/${UPSTREAM_BRANCH}:${IMAGE_FILE}" 2>/dev/null \
                  | sed -n "s/.*'-gcc:\(sha-[0-9a-f]*\)'.*/ghcr.io\/xemu-project\/xemu-win64-toolchain-gcc:\1/p" \
                  | head -n 1)
          if [ -z "$image" ]; then
            echo "::warning title=No toolchain image found in ${IMAGE_FILE}::Using ${FALLBACK_IMAGE}."
            image="$FALLBACK_IMAGE"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Windows toolchain image: \`${image}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build chd-support for Windows x86_64
    needs: sync
    if: github.event_name != 'workflow_dispatch' || inputs.build
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.sync.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
      # build.sh downloads some of what it needs, and the image has no curl
      - name: Install curl
        run: |
          apt-get update
          apt-get install -qy curl

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
          submodules: false

      - name: Mark the checkout safe for git, and fetch upstream's tags
        run: |
          git config --global --add safe.directory '*'
          # for the version string (git describe): the repository has no tags of its own
          git fetch --no-recurse-submodules "https://github.com/${UPSTREAM_REPO}.git" 'refs/tags/v*:refs/tags/v*'

      # As upstream's release build, without the compiler cache its incremental
      # LTO uses (a cache that would be gone by the next month)
      - name: Compile
        run: ./build.sh -p win64-cross -Db_lto=true -Dx86_version=3

      - name: Say what was built
        run: |
          {
            echo "### Build"
            echo "xemu \`$(git describe --tags --match 'v*' 2>/dev/null || echo unknown)\`, commit \`$(git rev-parse --short HEAD)\`"
            echo
            echo "The artifact is \`dist\`: xemu.exe, to be run with the usual BIOS files. It loads a CHD made with \`chdman createdvd\` or \`createcd\`; like any xemu, it needs the image in XISO form (the game partition alone, not a full Redump image)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: xemu-windows-x86_64-release-chd-support
          path: dist
